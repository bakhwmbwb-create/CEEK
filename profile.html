<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - أسرة دانيال النبي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0c0a;
      --card-bg: #1a1412;
      --primary-blue: #3a86ff;
      --accent-gold: #d4a373;
      --text-light: #f4f1de;
      --text-muted: #8e8779;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      padding: 20px 15px 50px 15px;
    }

    .container { max-width: 600px; margin: 0 auto; }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 15px auto;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent-gold);
      background-color: #2a2421;
    }

    .form-group { margin-bottom: 15px; text-align: right; }

    label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 600; }

    input {
      width: 100%;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: var(--text-light);
      font-size: 0.95rem;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      background: var(--primary-blue);
      color: #fff;
      margin-top: 10px;
    }

    .nav-back { display: inline-block; margin-bottom: 15px; color: var(--primary-blue); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>

  <div class="container">
    <a href="index.html" class="nav-back">➡️ العودة إلى الصفحة الرئيسية</a>

    <div class="card">
      <h2 style="color: var(--accent-gold); margin-bottom: 20px;">👤 الملف الشخصي</h2>

      <div class="avatar-wrapper">
        <img id="profilePreview" src="https://via.placeholder.com/120" class="avatar-img" alt="الصورة الشخصية">
      </div>

      <div class="form-group">
        <label>تغيير الصورة الشخصية:</label>
        <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">
      </div>

      <div class="form-group">
        <label>الاسم الكامل:</label>
        <input type="text" id="profileName">
      </div>

      <div class="form-group">
        <label>البريد الإلكتروني:</label>
        <input type="email" id="profileEmail" disabled style="opacity: 0.6; cursor: not-allowed;">
      </div>

      <button class="btn" onclick="saveProfile()">💾 حفظ التغييرات</button>
    </div>
  </div>

  <script>
    let defaultAvatar = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

    document.addEventListener('DOMContentLoaded', () => {
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      if (!currentUser) {
        alert('يرجى تسجيل الدخول أولاً!');
        window.location.href = 'index.html';
        return;
      }

      document.getElementById('profileName').value = currentUser.name || '';
      document.getElementById('profileEmail').value = currentUser.email || '';
      document.getElementById('profilePreview').src = currentUser.avatar || defaultAvatar;
    });

    function previewAvatar(event) {
      const file = event.target.files[0];
      if (file) {
        if (file.size > 2000000) {
          alert('⚠️ يرجى اختيار صورة حجمها أقل من 2 ميجابايت.');
          return;
        }
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('profilePreview').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function saveProfile() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      if (!currentUser) return;

      const newName = document.getElementById('profileName').value.trim();
      const newAvatar = document.getElementById('profilePreview').src;

      if (!newName) return alert('يرجى كتابة الاسم!');

      // 1. تحديث المستخدم الحالي
      currentUser.name = newName;
      currentUser.avatar = newAvatar;
      localStorage.setItem('currentUser', JSON.stringify(currentUser));

      // 2. تحديث الحساب في قائمة جميع الحسابات المسجلة
      let users = JSON.parse(localStorage.getItem('users')) || JSON.parse(localStorage.getItem('registeredUsers')) || [];
      users = users.map(u => {
        if (u.email.toLowerCase() === currentUser.email.toLowerCase()) {
          return { ...u, name: newName, avatar: newAvatar };
        }
        return u;
      });

      localStorage.setItem('users', JSON.stringify(users));
      localStorage.setItem('registeredUsers', JSON.stringify(users));

      alert('✅ تم حفظ التغييرات بنجاح!');
    }
  </script>
</body>
</html>
