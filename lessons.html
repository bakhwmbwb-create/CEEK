<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة أسرة دانيال النبي - الدروس</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0c0a;
      --card-bg: #1a1412;
      --primary-blue: #3a86ff;
      --accent-gold: #d4a373;
      --danger-red: #e63946;
      --text-light: #f4f1de;
      --text-muted: #8e8779;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; padding-bottom: 40px; }
    
    header { background: var(--card-bg); border-bottom: 1px solid rgba(212, 163, 115, 0.2); padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; }
    .header-avatar { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent-gold); cursor: pointer; user-select: none; }
    .header-title { font-size: 1.2rem; font-weight: 800; color: var(--accent-gold); margin-top: 5px; }

    #devAccessNotice { display: none; background: var(--primary-blue); color: #fff; padding: 8px; font-size: 0.85rem; font-weight: 700; text-decoration: none; text-align: center; }

    nav { display: flex; justify-content: space-around; background: rgba(26, 20, 18, 0.95); padding: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .nav-btn { background: transparent; border: none; color: var(--text-muted); font-size: 0.95rem; font-weight: 700; padding: 8px 16px; border-radius: 20px; text-decoration: none; transition: all 0.3s; }
    .nav-btn.active { background: var(--primary-blue); color: #fff; }

    .container { max-width: 650px; margin: 20px auto; padding: 0 15px; }
    .card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 15px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .post-media img, .post-media video { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 10px; }

    .interaction-bar { display: flex; gap: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 10px; margin-top: 10px; }
    .action-btn { background: rgba(255, 255, 255, 0.05); border: none; color: var(--text-light); padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 5px; }
    .action-btn.liked { color: var(--danger-red); }

    .comments-box { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
    .comment-item { background: rgba(0, 0, 0, 0.3); padding: 6px 10px; border-radius: 6px; font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <a href="developer.html" id="devAccessNotice">⚡ تم تفعيل نمط المطورين! اضغط هنا للتحويل إلى لوحة أداة النشر والحذف (+)</a>

  <header>
    <img src="daniel.jpeg" alt="دانيال النبي" class="header-avatar" ondblclick="triggerDevAccess()">
    <div class="header-title">منصة أسرة دانيال النبي</div>
  </header>

  <nav>
    <a href="index.html" class="nav-btn">📰 قسم الأخبار</a>
    <a href="lessons.html" class="nav-btn active">📚 قسم الدروس</a>
    <a href="families.html" class="nav-btn">🤝 قسم الأسر</a>
  </nav>

  <div class="container">
    <h3 style="color: var(--accent-gold); margin-bottom: 15px;">📚 مكتبة الدروس والمناهج</h3>
    <div id="lessonsFeed"></div>
  </div>

  <script src="script.js"></script>
  <script>
    // جلب منشورات صفحة الدروس فور التحميل
    loadPagePosts('gallery', 'lessonsFeed');
  </script>
</body>
</html>
