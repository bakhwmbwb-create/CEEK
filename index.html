<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول / إنشاء حساب - منصة أسرة دانيال النبي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0c0a;
      --card-bg: #1a1412;
      --primary-blue: #3a86ff;
      --accent-gold: #d4a373;
      --text-light: #f4f1de;
      --text-muted: #8e8779;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid rgba(212, 163, 115, 0.2);
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .avatar-wrapper {
      width: 85px;
      height: 85px;
      margin: 0 auto 15px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      overflow: hidden;
      box-shadow: 0 0 15px rgba(212, 163, 115, 0.3);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* أزرار التنقل بين التسجيل والإنشاء */
    .tabs-nav {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: var(--primary-blue);
      color: #ffffff;
    }

    /* أشكال النماذج */
    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      text-align: right;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-light);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 14px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: var(--text-light);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-blue);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary-blue);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s, transform 0.2s;
    }

    .btn-submit:hover {
      background: #2b6cb0;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .footer-links {
      margin-top: 20px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-links a {
      color: var(--accent-gold);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- الصورة الرمزية -->
    <div class="avatar-wrapper">
      <img id="avatarImg" src="daniel.jpeg" alt="دانيال النبي">
    </div>

    <!-- أزرار التبديل ومعرفاتها (IDs) -->
    <div class="tabs-nav">
      <button id="loginTabBtn" type="button" class="tab-btn active">تسجيل الدخول</button>
      <button id="registerTabBtn" type="button" class="tab-btn">إنشاء حساب جديد</button>
    </div>

    <!-- 1. نموذج تسجيل الدخول -->
    <form id="loginForm" class="auth-form active">
      <div class="form-group">
        <label for="loginUser">اسم المستخدم / البريد الإلكتروني</label>
        <input type="text" id="loginUser" placeholder="أدخل اسم المستخدم..." required>
      </div>

      <div class="form-group">
        <label for="loginPass">كلمة المرور</label>
        <input type="password" id="loginPass" placeholder="أدخل كلمة المرور..." required>
      </div>

      <button id="loginSubmitBtn" type="submit" class="btn-submit">دخول 🚀</button>
    </form>

    <!-- 2. نموذج إنشاء حساب جديد -->
    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label for="regName">الاسم الكامل</label>
        <input type="text" id="regName" placeholder="أدخل اسمك الثلاثي..." required>
      </div>

      <div class="form-group">
        <label for="regEmail">البريد الإلكتروني</label>
        <input type="email" id="regEmail" placeholder="example@gmail.com" required>
      </div>

      <div class="form-group">
        <label for="regPass">كلمة المرور</label>
        <input type="password" id="regPass" placeholder="اختر كلمة مرور قوية..." required>
      </div>

      <div class="form-group">
        <label for="regFamily">اختر الأسرة التابع لها (اختياري)</label>
        <select id="regFamily">
          <option value="">-- اختر الأسرة --</option>
          <option value="media">📸 أسرة الميديا</option>
          <option value="trips">🚌 أسرة الرحلات</option>
          <option value="conferences">🏛️ أسرة المؤتمرات</option>
          <option value="celestials">✨ أسرة السمائيين</option>
          <option value="hymns">🎵 أسرة الترانيم</option>
          <option value="prayers">🙏 أسرة الصلاة</option>
        </select>
      </div>

      <button id="registerSubmitBtn" type="submit" class="btn-submit">إنشاء الحساب 📝</button>
    </form>

    <div class="footer-links">
      <p>العودة إلى <a id="homeLink" href="index.html">الصفحة الرئيسية</a></p>
    </div>
  </div>

  <script src="java.js"></script>

</body>
</html>
